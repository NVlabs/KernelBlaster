name: kernelblaster

services:
  control:
    image: local/kernelblaster-control:pr04-${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: control
    init: true
    working_dir: /opt/kernelblaster
    # This is the sole service that receives the external LLM configuration.
    env_file:
      - ${KERNELBLASTER_CONTROL_ENV_FILE:?set KERNELBLASTER_CONTROL_ENV_FILE to an external control env file}
    environment:
      KERNELBLASTER_CONTROL_TOKEN: ${KERNELBLASTER_CONTROL_TOKEN:?set a control token}
      KERNELBLASTER_WORKER_TOKEN: ${KERNELBLASTER_WORKER_TOKEN:?set a distinct worker token}
      KERNELBLASTER_SUPERVISOR_TOKEN: ${KERNELBLASTER_SUPERVISOR_TOKEN:?set a distinct supervisor token}
      KERNELBLASTER_GPU_SUPERVISOR_URL: http://gpu-supervisor:2002
      KERNELBLASTER_STATE_DIR: /state
    command: ["python", "-m", "src.kernelblaster.servers.control", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      gpu-supervisor:
        condition: service_healthy
    networks: [control-plane, worker-plane]
    volumes:
      - ${KERNELBLASTER_STATE_HOST_DIR:-./out/state}:/state
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import os, urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health', headers={'Authorization': 'Bearer ' + os.environ['KERNELBLASTER_CONTROL_TOKEN']}); urllib.request.urlopen(request, timeout=3).read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  gpu-supervisor:
    image: local/kernelblaster-gpu-supervisor:cuda12.8-${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gpu-supervisor
    gpus: all
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=2g
    environment:
      KERNELBLASTER_WORKER_TOKEN: ${KERNELBLASTER_WORKER_TOKEN:?set a distinct worker token}
      KERNELBLASTER_SUPERVISOR_TOKEN: ${KERNELBLASTER_SUPERVISOR_TOKEN:?set a distinct supervisor token}
      KERNELBLASTER_CONTROL_URL: http://control:8000
      KERNELBLASTER_MAX_GPU_BINARY_BYTES: ${KERNELBLASTER_MAX_GPU_BINARY_BYTES:-268435456}
      KERNELBLASTER_GPU_DEVICE: ${KERNELBLASTER_GPU_DEVICE:-0}
      KERNELBLASTER_GPU_MAX_CONCURRENCY: "1"
      KERNELBLASTER_ALLOWED_TARGET_ARCHES: ${KERNELBLASTER_ALLOWED_TARGET_ARCHES:-}
      KERNELBLASTER_ENABLE_GENERATED_GPU_JOBS: ${KERNELBLASTER_ENABLE_GENERATED_GPU_JOBS:-false}
      # Generated jobs fail closed unless this is an immutable sha256 image
      # reference (repository@sha256:... or a locally inspected sha256 image ID).
      KERNELBLASTER_GPU_JOB_IMAGE: ${KERNELBLASTER_GPU_JOB_IMAGE:-}
      KERNELBLASTER_PRIVATE_EVALUATION_PROFILES: /run/kernelblaster/private-evaluation-profiles.json
      KERNELBLASTER_TRUSTED_BUNDLE_MANIFEST: /opt/kernelblaster/portfolio/trusted-gpu-bundles.json
      HOME: /tmp/home
    group_add:
      - "${KERNELBLASTER_DOCKER_GID:-0}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 16g
    networks: [worker-plane]
    volumes:
      # The trusted Supervisor creates and tears down ephemeral Job containers.
      # Job containers never receive this Docker API socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${KERNELBLASTER_PRIVATE_EVALUATION_PROFILES_HOST:-./portfolio/private-evaluation-profiles.empty.json}:/run/kernelblaster/private-evaluation-profiles.json:ro
    healthcheck:
      test:
        ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:2002/health', timeout=3).read()\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # Build-only target.  Inspect the resulting immutable image ID and provide it
  # as KERNELBLASTER_GPU_JOB_IMAGE before enabling generated GPU jobs.
  gpu-job-image:
    image: local/kernelblaster-gpu-job:cuda12.8-${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gpu-job
    profiles: [build]

  dev:
    image: local/kernelblaster-dev:cuda12.8-${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    profiles: [dev]
    gpus: all
    shm_size: 8gb
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      HOME: /tmp/home
      HF_HOME: /cache/huggingface
      TORCH_HOME: /cache/torch
      TRITON_CACHE_DIR: /cache/triton
      PYTHONPATH: /workspace
    volumes:
      - .:/workspace
      - ../../datasets/KernelBlaster:/data:ro
      - ../../checkpoints/KernelBlaster:/checkpoints
      - ../../runs/KernelBlaster:/runs
      - ../../caches/huggingface:/cache/huggingface
      - ../../caches/torch:/cache/torch
      - ../../caches/triton:/cache/triton
    command: bash

  smoke:
    image: local/kernelblaster-control:pr04-${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: control
    profiles: [smoke]
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    environment:
      KERNELBLASTER_CONTROL_TOKEN: ${KERNELBLASTER_CONTROL_TOKEN:?set a control token}
      KERNELBLASTER_WORKER_TOKEN: ${KERNELBLASTER_WORKER_TOKEN:?set a distinct worker token}
      KERNELBLASTER_SUPERVISOR_TOKEN: ${KERNELBLASTER_SUPERVISOR_TOKEN:?set a distinct supervisor token}
    depends_on:
      control:
        condition: service_healthy
      gpu-supervisor:
        condition: service_healthy
    networks: [control-plane, worker-plane]
    command: ["python", "scripts/compose_smoke.py"]

networks:
  control-plane: {}
  worker-plane:
    internal: true
